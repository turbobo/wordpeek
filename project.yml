name: WordPeek
options:
  bundleIdPrefix: app.wordpeek
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # 纯逻辑层：文本 diff / 词典解析 / 切词 / 查词管线（不依赖 AppKit，可单测）
  WordPeekCore:
    type: framework
    platform: macOS
    sources:
      - path: WordPeekCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wordpeek.mac.core
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "YES"

  # 应用层：Accessibility 监听 / 浮窗 / 设置窗口 / 菜单栏
  WordPeek:
    type: application
    platform: macOS
    sources:
      - path: WordPeek
    dependencies:
      - target: WordPeekCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wordpeek.mac
        INFOPLIST_FILE: WordPeek/Info.plist

  # 单元测试：只依赖 Core（headless，无需拉起 App）
  WordPeekTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WordPeekTests
    dependencies:
      - target: WordPeekCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wordpeek.mac.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  WordPeek:
    build:
      targets:
        WordPeek: all
    run:
      config: Debug
  WordPeekCore:
    build:
      targets:
        WordPeekCore: all
    test:
      config: Debug
      targets:
        - WordPeekTests
